<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Editor</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --grid: #cbd5e1;
      --empty: #eef5fb;
      --window-bg: #f8fbff;
      --island: #c4f5d7;
      --sea: #75e1ff;
      --hexborder: #f0f8ff;
      --label: #171717;
      --origin-fill: rgba(254, 243, 199, 0.85);
      --origin-stroke: #dc2626;
      --hover-stroke: #2563eb;
      --sel-stroke: #1d4ed8;
      --accent: #2563eb;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.25;
    }

    body { padding: 14px; }

    .page {
      height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h2 { margin: 0; font-size: 22px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    label { font-size: 13px; color: var(--muted); }

    input, select, button {
      padding: 6px 9px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
    }
    button { cursor: pointer; }
    button:hover { background: #f8fafc; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #1d4ed8; }
    button.danger { color: #b91c1c; border-color: #fca5a5; }
    button.danger:hover { background: #fef2f2; }

    /* ── Topbar ── */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
    }
    .topbar .spacer { flex: 1 1 auto; }
    .topbar .hint { font-size: 12px; color: var(--muted); }

    /* ── Layout ── */
    .layout {
      flex: 1 1 auto;
      display: flex;
      gap: 10px;
      min-height: 0;
    }

    /* ── Island list panel ── */
    .islands-panel {
      flex: 0 0 240px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .islands-panel .add-btn { width: 100%; margin-bottom: 10px; }
    .island-list { overflow-y: auto; flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; }
    .island-empty { font-size: 12px; color: var(--muted); font-style: italic; padding: 6px 2px; }

    .island-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
    }
    .island-row:hover { background: #f1f5f9; }
    .island-row.selected { background: #eff6ff; border-color: #bfdbfe; }
    .island-dot { width: 12px; height: 12px; border-radius: 3px; background: var(--island); border: 1px solid rgba(0,0,0,.12); flex: 0 0 auto; }
    .island-name-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .island-count { font-size: 11px; color: var(--muted); background: #f1f5f9; border-radius: 999px; padding: 1px 7px; }
    .island-del { font-size: 12px; line-height: 1; padding: 2px 6px; border-radius: 6px; color: #b91c1c; border-color: transparent; background: transparent; }
    .island-del:hover { background: #fef2f2; }

    /* ── Editor panel ── */
    .editor-panel {
      flex: 1 1 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .editor-empty {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-style: italic;
      font-size: 14px;
    }
    .editor-body { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field input { padding: 5px 8px; }
    .field input.q-r { width: 80px; }
    .field input.name { width: 180px; }
    .meta-row .spacer { flex: 1 1 auto; }
    .stat { font-size: 12px; color: var(--muted); }

    .board-area {
      flex: 1 1 auto;
      display: flex;
      gap: 10px;
      min-height: 0;
    }
    .board-wrap {
      flex: 1 1 auto;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      min-height: 200px;
      position: relative;
    }

    /* ── Elevation legend ── */
    .legend {
      flex: 0 0 auto;
      width: 66px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .legend-title { font-size: 11px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
    .legend-body { flex: 1 1 auto; display: flex; gap: 6px; min-height: 120px; }
    .legend-bar {
      width: 18px;
      border-radius: 5px;
      border: 1px solid rgba(0,0,0,.12);
    }
    .legend-ticks {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }
    .canvas-stack { position: relative; }
    .canvas-stack canvas { position: absolute; top: 0; left: 0; image-rendering: auto; }
    #editBaseCanvas { position: relative; }

    .hint { font-size: 12px; color: var(--muted); }

    /* ── Tool toggle ── */
    .tool-bar { display: flex; align-items: center; gap: 6px; }
    .tool-bar .tool-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 5px 12px;
    }
    .tool-btn .kbd {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
    }
    .tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tool-btn.active .kbd { color: #fff; border-color: rgba(255,255,255,.5); }

    .hex-label-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 9px;
    }
    .hex-label-bar.hidden { display: none; }
    .hex-label-bar .coord { font-size: 12px; color: var(--muted); }
    .hex-label-bar input { flex: 1 1 180px; }

    /* ── Preview modal ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      max-width: 95vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { margin: 0; }
    .modal-close {
      font-size: 16px;
      line-height: 1;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .modal-body {
      overflow: auto;
      padding: 12px;
      background: var(--bg);
    }
    #previewCanvas { display: block; border-radius: 8px; }
    .preview-empty { padding: 40px; color: var(--muted); font-style: italic; text-align: center; }

    #jsonText {
      width: min(80vw, 760px);
      height: 58vh;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      resize: vertical;
      white-space: pre;
      color: var(--text);
    }
    .json-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .json-msg { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h2>Island Editor</h2>
      <span class="spacer"></span>
      <button id="previewBtn" class="primary">Preview Map</button>
      <button id="showJsonBtn">Show JSON</button>
      <button id="pasteJsonBtn">Paste JSON</button>
      <button id="clearBtn" class="danger">Clear All</button>
    </div>

    <div class="layout">
      <!-- Island list -->
      <aside class="islands-panel">
        <h3>Islands</h3>
        <button id="addIslandBtn" class="add-btn primary">+ New Island</button>
        <div class="island-list" id="islandList">
          <div class="island-empty">No islands yet.</div>
        </div>
      </aside>

      <!-- Editor -->
      <main class="editor-panel">
        <div class="editor-empty" id="editorEmpty">Select or create an island to edit.</div>

        <div class="editor-body" id="editorBody" style="display:none;">
          <div class="meta-row">
            <div class="field">
              <label for="nameInput">Island name</label>
              <input id="nameInput" class="name" type="text">
            </div>
            <div class="field">
              <label for="centerQInput">Center q</label>
              <input id="centerQInput" class="q-r" type="number" step="1">
            </div>
            <div class="field">
              <label for="centerRInput">Center r</label>
              <input id="centerRInput" class="q-r" type="number" step="1">
            </div>
            <div class="field">
              <label for="zoomInput">Zoom <span id="zoomLabel">0.8x</span></label>
              <input id="zoomInput" type="range" min="0.3" max="2.0" step="0.1" value="0.8">
            </div>
            <span class="spacer"></span>
            <span class="stat" id="hexCountStat">0 hexes</span>
            <span class="stat" id="hoverStat">Hover: —</span>
          </div>

          <div class="tool-bar">
            <span class="tool-label">Tool</span>
            <button class="tool-btn active" id="toolDrawBtn">✏️ Draw <span class="kbd">D</span></button>
            <button class="tool-btn" id="toolSelectBtn">▣ Select <span class="kbd">S</span></button>
            <span style="width:14px;"></span>
            <span class="tool-label">Brush elevation</span>
            <input id="brushElev" type="range" min="0" max="20" step="1" value="0" style="width:130px;">
            <span id="brushElevVal" class="tool-label" style="min-width:16px;color:var(--text);">0</span>
          </div>

          <div class="board-area">
            <div class="board-wrap" id="boardWrap">
              <div class="canvas-stack" id="canvasStack">
                <canvas id="editBaseCanvas"></canvas>
                <canvas id="editPaintCanvas"></canvas>
                <canvas id="editUiCanvas"></canvas>
              </div>
            </div>
            <div class="legend">
              <div class="legend-title">Elev</div>
              <div class="legend-body">
                <div class="legend-bar" id="legendBar"></div>
                <div class="legend-ticks" id="legendTicks"></div>
              </div>
            </div>
          </div>

          <div class="hint" id="hintNote">Left click / drag = paint land · Right click / drag = erase</div>

          <div class="hex-label-bar hidden" id="hexLabelBar">
            <span class="coord" id="hexCoord"></span>
            <label>Elevation
              <input id="hexElev" type="range" min="0" max="20" step="1" style="width:120px;vertical-align:middle;">
            </label>
            <span id="hexElevVal" class="coord" style="min-width:16px;color:var(--text);"></span>
            <input id="hexLabelInput" type="text" placeholder="Hex label (e.g. Royal Palace, Port)…">
            <button id="hexLabelSaveBtn">Save Label</button>
            <button id="hexLabelClearBtn">Clear</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Preview modal -->
  <div class="modal-backdrop hidden" id="previewModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Map Preview</h3>
        <button class="modal-close" id="previewCloseBtn">✕</button>
      </div>
      <div class="modal-body" id="previewBody">
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- JSON modal (Show / Paste) -->
  <div class="modal-backdrop hidden" id="jsonModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="jsonModalTitle">JSON</h3>
        <button class="modal-close" id="jsonCloseBtn">✕</button>
      </div>
      <div class="modal-body">
        <textarea id="jsonText" spellcheck="false" placeholder="Paste map JSON here…"></textarea>
        <div class="json-actions">
          <button id="jsonCopyBtn" class="primary">Copy to clipboard</button>
          <button id="jsonLoadBtn">Load this JSON</button>
          <span class="json-msg" id="jsonMsg"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Hex geometry (inherited from the Grand Line map editor) ────────────────
    // Pointy-top axial hexes. Internal editor convention: y grows upward with -r.

    const HEX_SIZE = 10;
    const SQRT3    = Math.sqrt(3);
    const HEX_W    = SQRT3 * HEX_SIZE;   // hex width  (flat-to-flat)
    const HEX_H    = 2 * HEX_SIZE;       // hex height (point-to-point)
    const STEP_Y   = 1.5 * HEX_SIZE;     // vertical row step
    const PAD      = 24;

    const EDIT_RADIUS = 25;             // editing window = radius-25 hexagon (≈50 across)

    const HEX_DIRS = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];

    // Which corner pair (edge) faces each neighbour direction, for coastline
    // borders. Derived for the x=HEX_W*(q+r/2), y=STEP_Y*(-r) layout.
    const NEIGHBOR_TO_EDGE = {
      '1,0':  [0, 1],
      '1,-1': [1, 2],
      '0,-1': [2, 3],
      '-1,0': [3, 4],
      '-1,1': [4, 5],
      '0,1':  [5, 0],
    };

    const ISLAND_FILL = '#c4f5d7';
    const SEA_COLOR   = '#75e1ff';
    const BORDER_COL  = '#f0f8ff';
    const LABEL_COL   = '#171717';

    // ── Elevation / topographic ramp ───────────────────────────────────────────
    const ELEV_MIN = 0, ELEV_MAX = 20;
    // Control stops (elevation -> colour). Linear-interpolated between stops.
    const ELEV_STOPS = [
      [0,  [200, 240, 208]],  // lowland green
      [4,  [134, 207, 128]],  // green
      [8,  [216, 215, 107]],  // yellow-green
      [12, [202, 160, 82]],   // tan
      [16, [156, 107, 63]],   // brown
      [20, [247, 247, 247]],  // snow peak
    ];

    function elevationColor(e) {
      e = Math.max(ELEV_MIN, Math.min(ELEV_MAX, e || 0));
      for (let i = 0; i < ELEV_STOPS.length - 1; i++) {
        const [t0, c0] = ELEV_STOPS[i], [t1, c1] = ELEV_STOPS[i + 1];
        if (e <= t1) {
          const f = (e - t0) / (t1 - t0);
          const r = Math.round(c0[0] + (c1[0] - c0[0]) * f);
          const g = Math.round(c0[1] + (c1[1] - c0[1]) * f);
          const b = Math.round(c0[2] + (c1[2] - c0[2]) * f);
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
      }
      const last = ELEV_STOPS[ELEV_STOPS.length - 1][1];
      return 'rgb(' + last[0] + ',' + last[1] + ',' + last[2] + ')';
    }

    // Store elevation sparsely: only keep the key when it is non-zero, so flat
    // tiles carry no metadata at all (keeps the output light).
    function setElevation(meta, v) {
      v = Math.max(ELEV_MIN, Math.min(ELEV_MAX, v || 0));
      if (v > 0) meta.elevation = v; else delete meta.elevation;
    }

    const STORAGE_KEY = 'island_editor_v2';

    const cssVars      = getComputedStyle(document.documentElement);
    const GRID_COLOR   = cssVars.getPropertyValue('--grid').trim();
    const WINDOW_BG    = cssVars.getPropertyValue('--window-bg').trim();
    const ORIGIN_FILL  = cssVars.getPropertyValue('--origin-fill').trim();
    const ORIGIN_STROKE= cssVars.getPropertyValue('--origin-stroke').trim();
    const HOVER_STROKE = cssVars.getPropertyValue('--hover-stroke').trim();
    const SEL_STROKE   = cssVars.getPropertyValue('--sel-stroke').trim();

    function axialToPixel(q, r) {
      return { x: HEX_W * (q + r / 2), y: STEP_Y * (-r) };
    }

    function cubeRound(q, r) {
      let x = q, z = r, y = -x - z;
      let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
      const dx = Math.abs(rx-x), dy = Math.abs(ry-y), dz = Math.abs(rz-z);
      if (dx > dy && dx > dz) rx = -ry - rz;
      else if (dy > dz) ry = -rx - rz;
      else rz = -rx - ry;
      return { q: rx, r: rz };
    }

    function hexDistance(q1, r1, q2, r2) {
      return Math.max(Math.abs(q1-q2), Math.abs(r1-r2), Math.abs((q1+r1)-(q2+r2)));
    }

    function hexCorners(cx, cy, radius) {
      const pts = [];
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 180) * (60 * i - 30);
        pts.push([cx + radius * Math.cos(a), cy + radius * Math.sin(a)]);
      }
      return pts;
    }

    function makeHexPath(cx, cy, radius) {
      const p = new Path2D();
      const c = hexCorners(cx, cy, radius);
      for (let i = 0; i < 6; i++) {
        if (i === 0) p.moveTo(c[i][0], c[i][1]);
        else p.lineTo(c[i][0], c[i][1]);
      }
      p.closePath();
      return p;
    }

    function key(q, r) { return q + ',' + r; }

    // ── State ──────────────────────────────────────────────────────────────────
    // islands: name -> { center: {q, r}, hexes: Map<offKey, meta> }
    //   offKey is "dq,dr" relative to center; meta is an object that may carry
    //   hex_label and arbitrary future per-tile metadata (elevation, buildings…).
    const islands = new Map();

    let currentIsland = null;       // name of island being edited
    let selectedOff   = null;       // "dq,dr" of the hex shown in the label bar
    let toolMode      = 'draw';     // 'draw' | 'select'

    let windowCells   = new Map();  // offKey -> { dq, dr, cx, cy, basePath, fillPath, corners }
    let windowBounds  = null;

    let isMouseDown   = false;
    let mouseMode     = 'paint';
    let hoverOff      = '';
    let lastActionOff = '';
    let saveTimer     = null;
    let paintRafId    = null;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const islandListEl = document.getElementById('islandList');
    const addIslandBtn = document.getElementById('addIslandBtn');
    const editorEmpty  = document.getElementById('editorEmpty');
    const editorBody   = document.getElementById('editorBody');
    const nameInput    = document.getElementById('nameInput');
    const centerQInput = document.getElementById('centerQInput');
    const centerRInput = document.getElementById('centerRInput');
    const zoomInput    = document.getElementById('zoomInput');
    const zoomLabel    = document.getElementById('zoomLabel');
    const hexCountStat = document.getElementById('hexCountStat');
    const hoverStat    = document.getElementById('hoverStat');

    const boardWrap    = document.getElementById('boardWrap');
    const canvasStack  = document.getElementById('canvasStack');
    const baseCanvas   = document.getElementById('editBaseCanvas');
    const paintCanvas  = document.getElementById('editPaintCanvas');
    const uiCanvas     = document.getElementById('editUiCanvas');
    const baseCtx      = baseCanvas.getContext('2d');
    const paintCtx     = paintCanvas.getContext('2d');
    const uiCtx        = uiCanvas.getContext('2d');

    const toolDrawBtn   = document.getElementById('toolDrawBtn');
    const toolSelectBtn = document.getElementById('toolSelectBtn');
    const hintNote      = document.getElementById('hintNote');
    const brushElev     = document.getElementById('brushElev');
    const brushElevVal  = document.getElementById('brushElevVal');
    const legendBar     = document.getElementById('legendBar');
    const legendTicks   = document.getElementById('legendTicks');

    const hexLabelBar      = document.getElementById('hexLabelBar');
    const hexCoord         = document.getElementById('hexCoord');
    const hexElev          = document.getElementById('hexElev');
    const hexElevVal       = document.getElementById('hexElevVal');
    const hexLabelInput    = document.getElementById('hexLabelInput');
    const hexLabelSaveBtn  = document.getElementById('hexLabelSaveBtn');
    const hexLabelClearBtn = document.getElementById('hexLabelClearBtn');

    const previewBtn      = document.getElementById('previewBtn');
    const previewModal    = document.getElementById('previewModal');
    const previewBody     = document.getElementById('previewBody');
    const previewCloseBtn = document.getElementById('previewCloseBtn');
    const previewCanvas   = document.getElementById('previewCanvas');

    const showJsonBtn   = document.getElementById('showJsonBtn');
    const pasteJsonBtn  = document.getElementById('pasteJsonBtn');
    const jsonModal     = document.getElementById('jsonModal');
    const jsonModalTitle= document.getElementById('jsonModalTitle');
    const jsonCloseBtn  = document.getElementById('jsonCloseBtn');
    const jsonText      = document.getElementById('jsonText');
    const jsonCopyBtn   = document.getElementById('jsonCopyBtn');
    const jsonLoadBtn   = document.getElementById('jsonLoadBtn');
    const jsonMsg       = document.getElementById('jsonMsg');
    const clearBtn      = document.getElementById('clearBtn');

    // ── Editing window (radius-50 hexagon) ─────────────────────────────────────

    function buildWindowCells() {
      if (windowCells.size > 0) return; // window geometry is identical for all islands
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (let dq = -EDIT_RADIUS; dq <= EDIT_RADIUS; dq++) {
        for (let dr = -EDIT_RADIUS; dr <= EDIT_RADIUS; dr++) {
          if (hexDistance(dq, dr, 0, 0) > EDIT_RADIUS) continue;
          const p = axialToPixel(dq, dr);
          if (p.x - HEX_W/2 < minX) minX = p.x - HEX_W/2;
          if (p.x + HEX_W/2 > maxX) maxX = p.x + HEX_W/2;
          if (p.y - HEX_H/2 < minY) minY = p.y - HEX_H/2;
          if (p.y + HEX_H/2 > maxY) maxY = p.y + HEX_H/2;
        }
      }
      windowBounds = { minX, maxX, minY, maxY };
      for (let dq = -EDIT_RADIUS; dq <= EDIT_RADIUS; dq++) {
        for (let dr = -EDIT_RADIUS; dr <= EDIT_RADIUS; dr++) {
          if (hexDistance(dq, dr, 0, 0) > EDIT_RADIUS) continue;
          const p = axialToPixel(dq, dr);
          const cx = p.x - minX + PAD;
          const cy = p.y - minY + PAD;
          windowCells.set(key(dq, dr), {
            dq, dr, cx, cy,
            basePath: makeHexPath(cx, cy, HEX_SIZE),
            fillPath: makeHexPath(cx, cy, HEX_SIZE + 0.6),
            corners:  hexCorners(cx, cy, HEX_SIZE),
          });
        }
      }
      const w = Math.ceil(windowBounds.maxX - windowBounds.minX + PAD * 2);
      const h = Math.ceil(windowBounds.maxY - windowBounds.minY + PAD * 2);
      for (const c of [baseCanvas, paintCanvas, uiCanvas]) { c.width = w; c.height = h; }
      canvasStack.style.width = w + 'px';
      canvasStack.style.height = h + 'px';
    }

    function applyZoom() {
      const zoom = Number(zoomInput.value);
      zoomLabel.textContent = zoom.toFixed(1) + 'x';
      const w = baseCanvas.width * zoom + 'px';
      const h = baseCanvas.height * zoom + 'px';
      canvasStack.style.width = w; canvasStack.style.height = h;
      for (const c of [baseCanvas, paintCanvas, uiCanvas]) { c.style.width = w; c.style.height = h; }
    }

    // ── Editing window rendering ───────────────────────────────────────────────

    function renderEditBase() {
      baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
      // Paintable hexagon background
      baseCtx.fillStyle = WINDOW_BG;
      for (const cell of windowCells.values()) baseCtx.fill(cell.fillPath);
      // Grid
      baseCtx.lineWidth = 0.6;
      baseCtx.strokeStyle = GRID_COLOR;
      for (const cell of windowCells.values()) baseCtx.stroke(cell.basePath);
    }

    function curHexes() {
      const isl = islands.get(currentIsland);
      return isl ? isl.hexes : null;
    }

    function renderEditPaint() {
      paintCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
      const hexes = curHexes();
      if (!hexes) return;

      // Fill land — coloured by elevation (topographic)
      for (const [offKey, meta] of hexes) {
        const cell = windowCells.get(offKey);
        if (!cell) continue;
        paintCtx.fillStyle = elevationColor(meta && meta.elevation);
        paintCtx.fill(cell.fillPath);
      }

      // Coastline borders — edges that face an empty neighbour
      paintCtx.strokeStyle = BORDER_COL;
      paintCtx.lineWidth = 1.5;
      paintCtx.lineCap = 'round';
      paintCtx.beginPath();
      for (const offKey of hexes.keys()) {
        const cell = windowCells.get(offKey);
        if (!cell) continue;
        for (const [dq, dr] of HEX_DIRS) {
          if (hexes.has(key(cell.dq + dq, cell.dr + dr))) continue;
          const edge = NEIGHBOR_TO_EDGE[dq + ',' + dr];
          const a = cell.corners[edge[0]], b = cell.corners[edge[1]];
          paintCtx.moveTo(a[0], a[1]);
          paintCtx.lineTo(b[0], b[1]);
        }
      }
      paintCtx.stroke();

      // Hex labels
      paintCtx.font = 'bold 5.5px Arial';
      paintCtx.textAlign = 'center';
      paintCtx.textBaseline = 'middle';
      paintCtx.fillStyle = 'rgba(15,23,42,0.65)';
      for (const [offKey, meta] of hexes) {
        if (!meta || !meta.hex_label) continue;
        const cell = windowCells.get(offKey);
        if (cell) paintCtx.fillText(meta.hex_label, cell.cx, cell.cy);
      }
    }

    function renderEditUi() {
      uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

      // Center (0,0) marker
      const origin = windowCells.get(key(0, 0));
      if (origin) {
        uiCtx.save();
        uiCtx.fillStyle = ORIGIN_FILL;
        uiCtx.fill(origin.basePath);
        uiCtx.lineWidth = 2;
        uiCtx.strokeStyle = ORIGIN_STROKE;
        uiCtx.stroke(origin.basePath);
        uiCtx.restore();
      }

      // Selected hex
      if (selectedOff && windowCells.has(selectedOff)) {
        const c = windowCells.get(selectedOff);
        uiCtx.save();
        uiCtx.lineWidth = 2;
        uiCtx.strokeStyle = SEL_STROKE;
        uiCtx.stroke(c.basePath);
        uiCtx.restore();
      }

      // Hover
      if (hoverOff && windowCells.has(hoverOff)) {
        const c = windowCells.get(hoverOff);
        uiCtx.save();
        uiCtx.lineWidth = 1.6;
        uiCtx.strokeStyle = HOVER_STROKE;
        uiCtx.stroke(c.basePath);
        uiCtx.restore();
      }
    }

    function schedulePaintRedraw() {
      if (paintRafId !== null) return;
      paintRafId = requestAnimationFrame(() => { paintRafId = null; renderEditPaint(); });
    }

    function updateHexCount() {
      const hexes = curHexes();
      const n = hexes ? hexes.size : 0;
      hexCountStat.textContent = n + ' hex' + (n === 1 ? '' : 'es');
    }

    // ── Island list ────────────────────────────────────────────────────────────

    function renderIslandList() {
      const names = Array.from(islands.keys()).sort((a, b) => a.localeCompare(b));
      islandListEl.innerHTML = '';
      if (names.length === 0) {
        islandListEl.innerHTML = '<div class="island-empty">No islands yet.</div>';
        return;
      }
      for (const name of names) {
        const isl = islands.get(name);
        const row = document.createElement('div');
        row.className = 'island-row' + (name === currentIsland ? ' selected' : '');

        const dot = document.createElement('div');
        dot.className = 'island-dot';

        const lbl = document.createElement('span');
        lbl.className = 'island-name-label';
        lbl.textContent = name;

        const cnt = document.createElement('span');
        cnt.className = 'island-count';
        cnt.textContent = isl.hexes.size;

        const del = document.createElement('button');
        del.className = 'island-del';
        del.textContent = '✕';
        del.title = 'Delete island';
        del.addEventListener('click', (e) => { e.stopPropagation(); deleteIsland(name); });

        row.appendChild(dot);
        row.appendChild(lbl);
        row.appendChild(cnt);
        row.appendChild(del);
        row.addEventListener('click', () => selectIsland(name));
        islandListEl.appendChild(row);
      }
    }

    function uniqueName(base) {
      if (!islands.has(base)) return base;
      let i = 2;
      while (islands.has(base + '_' + i)) i++;
      return base + '_' + i;
    }

    function addIsland() {
      let n = 1;
      while (islands.has('island_' + n)) n++;
      const name = 'island_' + n;
      islands.set(name, { center: { q: 0, r: 0 }, hexes: new Map() });
      selectIsland(name);
      renderIslandList();
      scheduleSave();
      nameInput.focus();
      nameInput.select();
    }

    function deleteIsland(name) {
      if (!confirm('Delete island "' + name + '"? This removes all its hexes.')) return;
      islands.delete(name);
      if (currentIsland === name) {
        currentIsland = null;
        selectedOff = null;
        editorBody.style.display = 'none';
        editorEmpty.style.display = '';
      }
      renderIslandList();
      scheduleSave();
    }

    function selectIsland(name) {
      if (!islands.has(name)) return;
      currentIsland = name;
      selectedOff = null;
      const isl = islands.get(name);

      editorEmpty.style.display = 'none';
      editorBody.style.display = '';

      nameInput.value = name;
      centerQInput.value = isl.center.q;
      centerRInput.value = isl.center.r;

      buildWindowCells();
      applyZoom();
      renderEditBase();
      renderEditPaint();
      renderEditUi();
      updateHexCount();
      hideHexLabelBar();
      renderIslandList();

      // Center the scroll on the window centre
      requestAnimationFrame(() => {
        const zoom = Number(zoomInput.value);
        const o = windowCells.get(key(0, 0));
        if (o) {
          boardWrap.scrollLeft = Math.max(0, o.cx * zoom - boardWrap.clientWidth / 2);
          boardWrap.scrollTop  = Math.max(0, o.cy * zoom - boardWrap.clientHeight / 2);
        }
      });
    }

    // ── Metadata edits ──────────────────────────────────────────────────────────

    nameInput.addEventListener('change', () => {
      if (!currentIsland) return;
      let next = nameInput.value.trim();
      if (!next) { nameInput.value = currentIsland; return; }
      if (next === currentIsland) return;
      if (islands.has(next)) next = uniqueName(next);
      const isl = islands.get(currentIsland);
      islands.delete(currentIsland);
      islands.set(next, isl);
      currentIsland = next;
      nameInput.value = next;
      renderIslandList();
      scheduleSave();
    });

    function commitCenter() {
      if (!currentIsland) return;
      const q = parseInt(centerQInput.value, 10);
      const r = parseInt(centerRInput.value, 10);
      const isl = islands.get(currentIsland);
      if (Number.isFinite(q)) isl.center.q = q;
      if (Number.isFinite(r)) isl.center.r = r;
      scheduleSave();
    }
    centerQInput.addEventListener('change', commitCenter);
    centerRInput.addEventListener('change', commitCenter);

    zoomInput.addEventListener('input', () => { applyZoom(); scheduleSave(); });

    // ── Painting ────────────────────────────────────────────────────────────────

    function paintOff(offKey, mode) {
      const hexes = curHexes();
      if (!hexes) return;
      if (!windowCells.has(offKey)) return; // outside radius-50 window
      const actionId = mode + ':' + offKey;
      if (actionId === lastActionOff) return;
      lastActionOff = actionId;

      if (mode === 'erase') {
        if (!hexes.has(offKey)) return;
        hexes.delete(offKey);
        if (selectedOff === offKey) hideHexLabelBar();
      } else {
        const meta = hexes.get(offKey) || {};
        setElevation(meta, parseInt(brushElev.value, 10) || 0);
        hexes.set(offKey, meta);
      }
      schedulePaintRedraw();
      renderEditUi();
      updateHexCount();
      renderIslandList();
      scheduleSave();
    }

    // Input is handled on uiCanvas — the topmost layer in the stack, so it is
    // the element that actually receives pointer events.
    function mouseToOff(e) {
      const rect = uiCanvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (uiCanvas.width / rect.width);
      const py = (e.clientY - rect.top)  * (uiCanvas.height / rect.height);
      // Convert canvas px back to axial via nearest-centre search (robust, small window)
      let hit = null, best = HEX_SIZE * 1.25;
      for (const [k, cell] of windowCells) {
        const d = Math.hypot(px - cell.cx, py - cell.cy);
        if (d < best) { best = d; hit = k; }
      }
      return hit;
    }

    uiCanvas.addEventListener('contextmenu', e => e.preventDefault());

    uiCanvas.addEventListener('mousedown', (e) => {
      if (!currentIsland) return;
      const off = mouseToOff(e);
      if (!off) return;

      if (toolMode === 'select') {
        if (e.button !== 0) return;            // left-click selects
        const hexes = curHexes();
        if (hexes && hexes.has(off)) selectHex(off);
        else hideHexLabelBar();                // clicking empty clears selection
        return;
      }

      // draw mode
      isMouseDown = true;
      mouseMode = e.button === 2 ? 'erase' : 'paint';
      lastActionOff = '';
      paintOff(off, mouseMode);
    });

    uiCanvas.addEventListener('mousemove', (e) => {
      const off = mouseToOff(e);
      const next = off || '';
      if (next !== hoverOff) { hoverOff = next; renderEditUi(); }
      if (off) {
        const cell = windowCells.get(off);
        hoverStat.textContent = 'Hover: q=' + cell.dq + ', r=' + cell.dr + ' (offset)';
      } else {
        hoverStat.textContent = 'Hover: —';
      }
      if (toolMode === 'draw' && isMouseDown && off) paintOff(off, mouseMode);
    });

    uiCanvas.addEventListener('mouseleave', () => {
      if (hoverOff) { hoverOff = ''; hoverStat.textContent = 'Hover: —'; renderEditUi(); }
    });

    window.addEventListener('mouseup', () => {
      if (!isMouseDown) return;
      isMouseDown = false;
      lastActionOff = '';
      if (saveTimer !== null) { clearTimeout(saveTimer); flushSave(); }
    });

    // ── Tool mode ────────────────────────────────────────────────────────────
    function setToolMode(mode) {
      toolMode = mode;
      toolDrawBtn.classList.toggle('active', mode === 'draw');
      toolSelectBtn.classList.toggle('active', mode === 'select');
      if (mode === 'draw') {
        uiCanvas.style.cursor = 'crosshair';
        hintNote.textContent = 'Left click / drag = paint land · Right click / drag = erase';
        hideHexLabelBar();
      } else {
        uiCanvas.style.cursor = 'pointer';
        hintNote.textContent = 'Click a painted tile to select it and edit it individually';
      }
    }

    toolDrawBtn.addEventListener('click', () => setToolMode('draw'));
    toolSelectBtn.addEventListener('click', () => setToolMode('select'));

    brushElev.addEventListener('input', () => {
      brushElevVal.textContent = brushElev.value;
      scheduleSave();
    });

    function buildLegend() {
      // Gradient strip (bottom = 0, top = 20)
      const stops = ELEV_STOPS.map(([t, c]) =>
        'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ') ' + (t / ELEV_MAX * 100) + '%');
      legendBar.style.background = 'linear-gradient(to top, ' + stops.join(', ') + ')';
      // Tick labels 20 → 0
      legendTicks.innerHTML = '';
      for (const v of [20, 15, 10, 5, 0]) {
        const d = document.createElement('div');
        d.textContent = v;
        legendTicks.appendChild(d);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'd' || e.key === 'D') setToolMode('draw');
      if (e.key === 's' || e.key === 'S') setToolMode('select');
    });

    // ── Hex label bar ─────────────────────────────────────────────────────────

    function selectHex(offKey) {
      selectedOff = offKey;
      const cell = windowCells.get(offKey);
      const isl = islands.get(currentIsland);
      const meta = isl.hexes.get(offKey) || {};
      const absQ = isl.center.q + cell.dq;
      const absR = isl.center.r + cell.dr;
      hexCoord.textContent = 'offset q=' + cell.dq + ', r=' + cell.dr + '  ·  world q=' + absQ + ', r=' + absR;
      hexLabelInput.value = meta.hex_label || '';
      const ev = meta.elevation || 0;
      hexElev.value = ev;
      hexElevVal.textContent = ev;
      hexLabelBar.classList.remove('hidden');
      renderEditUi();
    }

    function hideHexLabelBar() {
      selectedOff = null;
      hexLabelBar.classList.add('hidden');
      renderEditUi();
    }

    hexLabelSaveBtn.addEventListener('click', () => {
      if (!selectedOff || !currentIsland) return;
      const hexes = curHexes();
      const meta = hexes.get(selectedOff);
      if (!meta) return;
      const v = hexLabelInput.value.trim();
      if (v) meta.hex_label = v; else delete meta.hex_label;
      schedulePaintRedraw();
      scheduleSave();
    });
    hexLabelClearBtn.addEventListener('click', () => {
      hexLabelInput.value = '';
      hexLabelSaveBtn.click();
    });
    hexLabelInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') hexLabelSaveBtn.click(); });

    hexElev.addEventListener('input', () => {
      hexElevVal.textContent = hexElev.value;
      if (!selectedOff || !currentIsland) return;
      const meta = curHexes().get(selectedOff);
      if (!meta) return;
      setElevation(meta, parseInt(hexElev.value, 10) || 0);
      schedulePaintRedraw();
      scheduleSave();
    });

    // ── Preview (static full-map render) ───────────────────────────────────────

    function openPreview() {
      previewModal.classList.remove('hidden');
      renderPreview();
    }
    function closePreview() { previewModal.classList.add('hidden'); }

    previewBtn.addEventListener('click', openPreview);
    previewCloseBtn.addEventListener('click', closePreview);
    previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreview(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePreview(); closeJsonModal(); } });

    function collectWorldHexes() {
      // Returns { set:Set("q,r"), hexes:[{q,r,meta}], labels:[{name,q,r}] }
      const set = new Set();
      const hexes = [];
      const labels = [];
      for (const [name, isl] of islands) {
        if (isl.hexes.size === 0) continue;
        for (const [offKey, meta] of isl.hexes) {
          const [dq, dr] = offKey.split(',').map(Number);
          const q = isl.center.q + dq, r = isl.center.r + dr;
          set.add(key(q, r));
          hexes.push({ q, r, meta });
        }
        labels.push({ name, q: isl.center.q, r: isl.center.r });
      }
      return { set, hexes, labels };
    }

    function renderPreview() {
      const { set, hexes, labels } = collectWorldHexes();
      const ctx = previewCanvas.getContext('2d');

      const old = previewBody.querySelector('.preview-empty');
      if (old) old.remove();

      if (hexes.length === 0) {
        previewCanvas.style.display = 'none';
        const msg = document.createElement('div');
        msg.className = 'preview-empty';
        msg.textContent = 'No island hexes painted yet.';
        previewBody.appendChild(msg);
        return;
      }
      previewCanvas.style.display = '';

      // Bounding box around the available islands only (no fixed bounds, no calm belt)
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const { q, r } of hexes) {
        const p = axialToPixel(q, r);
        if (p.x - HEX_W/2 < minX) minX = p.x - HEX_W/2;
        if (p.x + HEX_W/2 > maxX) maxX = p.x + HEX_W/2;
        if (p.y - HEX_H/2 < minY) minY = p.y - HEX_H/2;
        if (p.y + HEX_H/2 > maxY) maxY = p.y + HEX_H/2;
      }
      const margin = HEX_H * 1.5;
      minX -= margin; maxX += margin; minY -= margin; maxY += margin;

      const w = Math.ceil(maxX - minX);
      const h = Math.ceil(maxY - minY);
      // Scale to fit the viewport while staying crisp
      const maxW = Math.min(window.innerWidth * 0.9, 1400);
      const maxH = Math.min(window.innerHeight * 0.78, 1000);
      const scale = Math.min(1.4, maxW / w, maxH / h);

      previewCanvas.width = Math.ceil(w * scale);
      previewCanvas.height = Math.ceil(h * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);

      const toXY = (q, r) => { const p = axialToPixel(q, r); return { x: p.x - minX, y: p.y - minY }; };

      // Sea background
      ctx.fillStyle = SEA_COLOR;
      ctx.fillRect(0, 0, w, h);

      // Land fills — coloured by elevation (topographic)
      for (const { q, r, meta } of hexes) {
        const c = toXY(q, r);
        ctx.fillStyle = elevationColor(meta && meta.elevation);
        ctx.fill(makeHexPath(c.x, c.y, HEX_SIZE + 0.6));
      }

      // Coastline borders
      ctx.strokeStyle = BORDER_COL;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (const { q, r } of hexes) {
        const c = toXY(q, r);
        const corners = hexCorners(c.x, c.y, HEX_SIZE);
        for (const [dq, dr] of HEX_DIRS) {
          if (set.has(key(q + dq, r + dr))) continue;
          const edge = NEIGHBOR_TO_EDGE[dq + ',' + dr];
          const a = corners[edge[0]], b = corners[edge[1]];
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
        }
      }
      ctx.stroke();

      // Per-hex labels
      ctx.font = 'bold 6px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(15,23,42,0.7)';
      for (const { q, r, meta } of hexes) {
        if (!meta || !meta.hex_label) continue;
        const c = toXY(q, r);
        ctx.fillText(meta.hex_label, c.x, c.y);
      }

      // Island name labels on top
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const { name, q, r } of labels) {
        const c = toXY(q, r);
        const tw = ctx.measureText(name).width;
        const padX = 5, padY = 3, rd = 4;
        const bx = c.x - tw/2 - padX, by = c.y - 7 - padY;
        const bw = tw + padX*2, bh = 14 + padY*2;
        ctx.fillStyle = 'rgba(15,23,42,0.78)';
        ctx.beginPath();
        ctx.moveTo(bx+rd, by); ctx.lineTo(bx+bw-rd, by);
        ctx.quadraticCurveTo(bx+bw, by, bx+bw, by+rd);
        ctx.lineTo(bx+bw, by+bh-rd);
        ctx.quadraticCurveTo(bx+bw, by+bh, bx+bw-rd, by+bh);
        ctx.lineTo(bx+rd, by+bh);
        ctx.quadraticCurveTo(bx, by+bh, bx, by+bh-rd);
        ctx.lineTo(bx, by+rd);
        ctx.quadraticCurveTo(bx, by, bx+rd, by);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText(name, c.x, c.y);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    // ── Export / import ──────────────────────────────────────────────────────────

    // Compact format:
    //   centers : { name -> {q,r} }            quick index for the bot broad-phase
    //   islands : { name -> {
    //       origin : {q,r},                     island centre in world coords
    //       radius : int,                       max hex distance from centre
    //       hexes  : [[dq,dr], ...],            shape as offsets from origin
    //       elev   : [int, ...],                dense, parallel to hexes (omitted if all 0)
    //       meta   : { "dq,dr" -> {...} }        sparse, only tiles with extra metadata
    //   }}
    // Elevation is dense so it rides in a parallel array; sparse fields (labels,
    // future per-tile data) live in `meta` keyed by offset.
    function buildJsonPayload() {
      const centers = {};
      const islandsObj = {};
      for (const [name, isl] of islands) {
        centers[name] = { q: isl.center.q, r: isl.center.r };

        const hexes = [];
        const elev = [];
        const meta = {};
        let radius = 0, anyElev = false;

        for (const [offKey, m] of isl.hexes) {
          const [dq, dr] = offKey.split(',').map(Number);
          hexes.push([dq, dr]);
          const e = (m && m.elevation) || 0;
          elev.push(e);
          if (e) anyElev = true;
          radius = Math.max(radius, hexDistance(dq, dr, 0, 0));
          // Everything except elevation is sparse metadata.
          const rest = {};
          if (m) for (const [k, v] of Object.entries(m)) { if (k !== 'elevation') rest[k] = v; }
          if (Object.keys(rest).length) meta[offKey] = rest;
        }

        const out = { origin: { q: isl.center.q, r: isl.center.r }, radius, hexes };
        if (anyElev) out.elev = elev;
        if (Object.keys(meta).length) out.meta = meta;
        islandsObj[name] = out;
      }
      return {
        version: 2,
        format: 'island_editor',
        saved_at: new Date().toISOString(),
        edit_radius: EDIT_RADIUS,
        centers,
        islands: islandsObj,
      };
    }

    // Readable but compact: top-level keys indented, but the big per-island
    // arrays (hexes/elev) and the meta map stay inline so the file doesn't
    // balloon the way JSON.stringify(…, null, 2) would on nested arrays.
    function prettyPayload(p) {
      const L = [];
      L.push('{');
      L.push('  "version": ' + p.version + ',');
      L.push('  "format": ' + JSON.stringify(p.format) + ',');
      L.push('  "saved_at": ' + JSON.stringify(p.saved_at) + ',');
      L.push('  "edit_radius": ' + p.edit_radius + ',');
      L.push('  "centers": ' + JSON.stringify(p.centers) + ',');
      L.push('  "islands": {');
      const names = Object.keys(p.islands);
      names.forEach((name, i) => {
        const isl = p.islands[name];
        const parts = [
          '"origin":' + JSON.stringify(isl.origin),
          '"radius":' + isl.radius,
          '"hexes":' + JSON.stringify(isl.hexes),
        ];
        if (isl.elev) parts.push('"elev":' + JSON.stringify(isl.elev));
        if (isl.meta) parts.push('"meta":' + JSON.stringify(isl.meta));
        L.push('    ' + JSON.stringify(name) + ': { ' + parts.join(', ') + ' }' + (i < names.length - 1 ? ',' : ''));
      });
      L.push('  }');
      L.push('}');
      return L.join('\n');
    }

    function finishImport(dropped) {
      currentIsland = null;
      selectedOff = null;
      editorBody.style.display = 'none';
      editorEmpty.style.display = '';
      renderIslandList();
      flushSave();
      if (dropped > 0) {
        alert(dropped + ' hex(es) were further than radius ' + EDIT_RADIUS +
              ' from their island center and were dropped on import.');
      }
    }

    function loadJsonPayload(data) {
      if (!data || typeof data !== 'object') throw new Error('Invalid JSON file.');

      // New compact format: islands{} entries carry a `hexes` offset array.
      const looksCompact = data.islands && typeof data.islands === 'object' &&
        Object.values(data.islands).some(v => v && Array.isArray(v.hexes));
      if (looksCompact) return loadCompactPayload(data);

      // Legacy compatible format: a flat tiles[] array.
      if (Array.isArray(data.tiles)) return loadLegacyPayload(data);

      throw new Error('Unrecognized JSON: expected islands{…,hexes:[…]} or a tiles[] array.');
    }

    function loadCompactPayload(data) {
      islands.clear();
      let dropped = 0;
      for (const [name, isl] of Object.entries(data.islands)) {
        if (!isl || typeof isl !== 'object') continue;
        const o = isl.origin || {};
        const center = { q: Number(o.q) || 0, r: Number(o.r) || 0 };
        const offs = Array.isArray(isl.hexes) ? isl.hexes : [];
        const elev = Array.isArray(isl.elev) ? isl.elev : null;
        const metaMap = (isl.meta && typeof isl.meta === 'object') ? isl.meta : {};
        const hexes = new Map();
        offs.forEach((pair, i) => {
          if (!Array.isArray(pair) || pair.length < 2) return;
          const dq = Number(pair[0]), dr = Number(pair[1]);
          if (!Number.isFinite(dq) || !Number.isFinite(dr)) return;
          if (hexDistance(dq, dr, 0, 0) > EDIT_RADIUS) { dropped++; return; }
          const m = {};
          const extra = metaMap[dq + ',' + dr];
          if (extra && typeof extra === 'object') {
            for (const [k, v] of Object.entries(extra)) { if (k !== 'elevation') m[k] = v; }
          }
          const e = elev ? (Number(elev[i]) || 0) : 0;
          if (e > 0) m.elevation = Math.max(ELEV_MIN, Math.min(ELEV_MAX, e));
          hexes.set(key(dq, dr), m);
        });
        islands.set(name, { center, hexes });
      }
      finishImport(dropped);
    }

    function loadLegacyPayload(data) {
      // Group tiles by island; only import land (island) tiles with a name.
      const groups = new Map(); // name -> [{q, r, meta}]
      for (const row of data.tiles) {
        if (!row || typeof row !== 'object') continue;
        const q = Number(row.q), r = Number(row.r);
        if (!Number.isFinite(q) || !Number.isFinite(r)) continue;
        const type = String(row.hex_type || 'island').toLowerCase();
        if (type !== 'island') continue; // skip redline / calm_belt / etc.
        const name = String(row.island_name || row.island_id || '').trim();
        if (!name) continue;
        const meta = {};
        for (const [k, v] of Object.entries(row)) {
          if (k === 'q' || k === 'r' || k === 'hex_type' || k === 'island_name' || k === 'island_id') continue;
          meta[k] = v;
        }
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push({ q, r, meta });
      }

      const declaredCenters = {};
      if (data.islands && typeof data.islands === 'object') {
        for (const [name, idata] of Object.entries(data.islands)) {
          const o = idata && idata.origin;
          if (o && Number.isFinite(Number(o.q)) && Number.isFinite(Number(o.r))) {
            declaredCenters[name] = { q: Number(o.q), r: Number(o.r) };
          }
        }
      }

      islands.clear();
      let dropped = 0;
      for (const [name, rows] of groups) {
        // Choose a center: declared origin, else rounded centroid of the hexes.
        let center = declaredCenters[name];
        if (!center) {
          let sq = 0, sr = 0;
          for (const { q, r } of rows) { sq += q; sr += r; }
          center = cubeRound(sq / rows.length, sr / rows.length);
        }
        const hexes = new Map();
        for (const { q, r, meta } of rows) {
          const dq = q - center.q, dr = r - center.r;
          if (hexDistance(dq, dr, 0, 0) > EDIT_RADIUS) { dropped++; continue; }
          hexes.set(key(dq, dr), meta);
        }
        islands.set(name, { center, hexes });
      }
      // Carry over declared islands that had no tiles (empty islands).
      for (const [name, center] of Object.entries(declaredCenters)) {
        if (!islands.has(name)) islands.set(name, { center, hexes: new Map() });
      }

      finishImport(dropped);
    }

    // ── Persistence (localStorage) ───────────────────────────────────────────────

    function serializeIslands() {
      const out = [];
      for (const [name, isl] of islands) {
        out.push([name, { center: isl.center, hexes: Array.from(isl.hexes.entries()) }]);
      }
      return out;
    }

    function flushSave() {
      saveTimer = null;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          islands: serializeIslands(),
          currentIsland,
          zoom: zoomInput.value,
          brushElev: brushElev.value,
        }));
      } catch (e) { /* storage full / disabled — ignore */ }
    }

    function scheduleSave() {
      if (saveTimer !== null) return;
      saveTimer = window.setTimeout(flushSave, 200);
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.islands)) {
          for (const [name, isl] of data.islands) {
            const hexes = new Map();
            if (Array.isArray(isl.hexes)) for (const [k, v] of isl.hexes) hexes.set(k, v || {});
            islands.set(name, { center: isl.center || { q: 0, r: 0 }, hexes });
          }
        }
        if (data.zoom) zoomInput.value = data.zoom;
        if (data.brushElev != null) { brushElev.value = data.brushElev; brushElevVal.textContent = data.brushElev; }
        renderIslandList();
        if (data.currentIsland && islands.has(data.currentIsland)) selectIsland(data.currentIsland);
        return true;
      } catch (e) { return false; }
    }

    // ── Toolbar ──────────────────────────────────────────────────────────────────

    addIslandBtn.addEventListener('click', addIsland);

    function openJsonModal() { jsonModal.classList.remove('hidden'); }
    function closeJsonModal() { jsonModal.classList.add('hidden'); }

    showJsonBtn.addEventListener('click', () => {
      jsonModalTitle.textContent = 'Map JSON';
      jsonText.value = prettyPayload(buildJsonPayload());
      jsonText.readOnly = false;
      jsonMsg.textContent = '';
      openJsonModal();
      requestAnimationFrame(() => { jsonText.focus(); jsonText.select(); });
    });

    pasteJsonBtn.addEventListener('click', () => {
      jsonModalTitle.textContent = 'Paste JSON';
      jsonText.value = '';
      jsonText.readOnly = false;
      jsonMsg.textContent = 'Paste your map JSON below, then “Load this JSON”.';
      openJsonModal();
      requestAnimationFrame(() => jsonText.focus());
    });

    jsonCopyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(jsonText.value);
      } catch (e) {
        jsonText.select();
        try { document.execCommand('copy'); } catch (e2) { /* ignore */ }
      }
      jsonMsg.textContent = 'Copied to clipboard!';
      setTimeout(() => { jsonMsg.textContent = ''; }, 1500);
    });

    jsonLoadBtn.addEventListener('click', () => {
      try {
        loadJsonPayload(JSON.parse(jsonText.value));
        jsonMsg.textContent = 'Loaded!';
        setTimeout(closeJsonModal, 500);
      } catch (err) {
        jsonMsg.textContent = (err && err.message) ? err.message : 'Could not parse JSON.';
      }
    });

    jsonCloseBtn.addEventListener('click', closeJsonModal);
    jsonModal.addEventListener('click', (e) => { if (e.target === jsonModal) closeJsonModal(); });

    clearBtn.addEventListener('click', () => {
      if (!confirm('Clear ALL islands? This cannot be undone.')) return;
      islands.clear();
      currentIsland = null;
      selectedOff = null;
      editorBody.style.display = 'none';
      editorEmpty.style.display = '';
      renderIslandList();
      flushSave();
    });

    // ── Boot ───────────────────────────────────────────────────────────────────
    buildLegend();
    setToolMode('draw');
    loadState();
  </script>
</body>
</html>
